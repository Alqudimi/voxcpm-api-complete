name: Security & Vulnerability Scan

on:
  schedule:
    - cron: '0 4 * * 1' # كل يوم اثنين الساعة 4 صباحاً
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Secrets & Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit[toml]

      - name: Check for Exposed Secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Pip-Audit (Dependency Vulnerabilities)
        run: |
          pip-audit -r requirements.txt || true

      - name: Run Bandit (Python Static Code Security Analysis)
        run: |
          bandit -r app/ -ll -i || true
