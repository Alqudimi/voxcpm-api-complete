name: API Specification & Docs Validation

on:
  push:
    paths:
      - 'app/main.py'
      - 'app/api/**'
      - 'app/schemas/**'
      - 'docs/**'
      - '.github/workflows/api-spec.yml'
  pull_request:
    paths:
      - 'app/main.py'
      - 'app/api/**'
      - 'app/schemas/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-openapi:
    name: Generate & Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Minimal Requirements for App Schema
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings uvicorn python-multipart

      - name: Extract OpenAPI JSON
        run: |
          python3 -c "
          import json, sys
          try:
              # استيراد محاكاة بيئة دون تحميل أوزان الموديل
              import os
              os.environ['SKIP_MODEL_PRELOAD'] = '1'
              os.environ['VOXCPM_AUTO_INIT_DB'] = 'false'
              from app.main import app
              schema = app.openapi()
              with open('openapi.json', 'w', encoding='utf-8') as f:
                  json.dump(schema, f, indent=2)
              print('Successfully generated openapi.json. Total routes:', len(schema.get('paths', {})))
          except Exception as e:
              print('OpenAPI extraction note:', e, file=sys.stderr)
          " || true

      - name: Upload OpenAPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
          if-no-files-found: ignore
