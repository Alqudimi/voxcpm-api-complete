name: Docker Image Build & Release Publisher

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # Branch pushes update one rolling release; version tags create immutable releases.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-docker:
    name: Build Docker, Publish to Registry & Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Docker Tag
        id: repo-name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Determine Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Export a Docker image archive for both rolling branch releases and versioned releases.
      - name: Export and Compress Docker Image Archive for Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          LOWER_REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          PRIMARY_TAG="ghcr.io/${LOWER_REPO}:${RELEASE_TAG}"
          echo "Pulling/Saving built image: $PRIMARY_TAG"
          docker pull "$PRIMARY_TAG"
          docker save "$PRIMARY_TAG" | gzip > "voxcpm-docker-image-${RELEASE_TAG}.tar.gz"
          echo "Docker image archive created: voxcpm-docker-image-${RELEASE_TAG}.tar.gz"

      - name: Create Source Packages for Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' -czf "voxcpm-api-${RELEASE_TAG}.tar.gz" .
          zip -r "voxcpm-api-${RELEASE_TAG}.zip" . -x "*.git*" "*.github*" "*__pycache__*"

      - name: Publish or Update GitHub Release with Docker Archive
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG == 'latest' && 'Latest build' || format('Release {0}', env.RELEASE_TAG) }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          body: |
            ## 🚀 VoxCPM API Release ${{ env.RELEASE_TAG }}
            ### 🐳 Docker Container:
            - **Registry Image (GHCR)**:
              ```bash
              docker pull ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
              ```
            - **Latest Image**:
              ```bash
              docker pull ghcr.io/${{ github.repository }}:latest
              ```
            - **Offline Image Tarball**: You can download `voxcpm-docker-image-${{ env.RELEASE_TAG }}.tar.gz` attached below and load it offline using:
              ```bash
              docker load < voxcpm-docker-image-${{ env.RELEASE_TAG }}.tar.gz
              ```
          files: |
            voxcpm-docker-image-${{ env.RELEASE_TAG }}.tar.gz
            voxcpm-api-${{ env.RELEASE_TAG }}.tar.gz
            voxcpm-api-${{ env.RELEASE_TAG }}.zip
            install-and-start.sh
            install-colab.sh
            Dockerfile
            docker-compose.yml
